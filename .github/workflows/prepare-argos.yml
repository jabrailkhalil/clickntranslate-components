name: Prepare Argos Windows candidate
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact ClicknTranslate source commit containing the component tools
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: components
      - name: Require an immutable source revision
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'Use the complete 40-character source commit hash.' }
      - uses: actions/checkout@v4
        with:
          repository: jabrailkhalil/clickntranslate
          ref: ${{ inputs.source_ref }}
          path: application
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests packaging pefile==2024.8.26
      - name: Prepare private runtime and verify pinned model sources
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/application/src;$PWD/application/tools"
          @'
          import json, os
          from pathlib import Path
          import requests
          from component_store import file_digest
          from prepare_component_runtime import prepare
          from prepare_argos_catalog import prepare as catalog
          root = Path(os.environ['RUNNER_TEMP'])/'ClicknTranslate-QA/argos-candidate'
          runtime, models = root/'prepared', root/'models'
          prepare(runtime, Path('components/recipes/argos-windows-x64.json'))
          models.mkdir(parents=True)
          description = json.loads(Path('components/recipes/argos-windows-models.json').read_bytes())
          for model in description['artifacts']:
              path = models/model['url'].rsplit('/',1)[1]
              with requests.get(model['url'], stream=True, timeout=180) as response:
                  response.raise_for_status()
                  with path.open('wb') as target:
                      for block in response.iter_content(1024*1024):
                          if target.tell()+len(block)>model['size']:
                              raise RuntimeError('Model exceeds approved size')
                          target.write(block)
              if path.stat().st_size!=model['size'] or file_digest(path)!=model['sha256']:
                  raise RuntimeError('Model source checksum mismatch')
          artifact = json.loads((runtime/'runtime-artifact.json').read_bytes())
          (root/'catalog-candidate.json').write_text(json.dumps(catalog(artifact, description),indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Argos preparation failed' }
      - name: Test native directions, pivot, update, cancellation, offline removal and rollback
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/ClicknTranslate-QA/argos-candidate"
          python application/tools/qa_argos_components.py --catalog "$root/catalog-candidate.json" --runtime "$root/prepared/argos-windows-x64-cp312-runtime.zip" --models "$root/models" --output "$root/verification"
          if ($LASTEXITCODE -ne 0) { throw 'Argos native validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: argos-windows-native-candidate
          path: |
            ${{ runner.temp }}/ClicknTranslate-QA/argos-candidate/prepared/argos-windows-x64-cp312-runtime.zip
            ${{ runner.temp }}/ClicknTranslate-QA/argos-candidate/prepared/runtime-artifact.json
            ${{ runner.temp }}/ClicknTranslate-QA/argos-candidate/prepared/requirements.lock
            ${{ runner.temp }}/ClicknTranslate-QA/argos-candidate/prepared/runtime/NATIVE-DEPENDENCIES.json
            ${{ runner.temp }}/ClicknTranslate-QA/argos-candidate/catalog-candidate.json
            ${{ runner.temp }}/ClicknTranslate-QA/argos-candidate/verification/verification.json
          compression-level: 0
          retention-days: 30
