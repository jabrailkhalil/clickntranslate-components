name: Verify native Windows Tesseract publication candidate
on:
  push:
    branches: [windows-components-publication]
    paths: ['scripts/prepare_native_tesseract_windows.py', 'recipes/tesseract-windows-native-x64.json', '.github/workflows/prepare-tesseract-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pefile pillow==12.3.0
      - run: python scripts/prepare_native_tesseract_windows.py --recipe recipes/tesseract-windows-native-x64.json --output prepared-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-windows-native-candidate
          path: |
            prepared-native/*runtime.zip
            prepared-native/*sources.zip
            prepared-native/runtime-artifact.json
            prepared-native/verification.json
            prepared-native/relocated runtime with spaces/NATIVE-DEPENDENCIES.json
          compression-level: 0
          retention-days: 14
