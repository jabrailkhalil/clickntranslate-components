name: Discover upstream component candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests packaging
      - run: python -m unittest discover -s tests -v
      - run: python scripts/discover.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-candidates
          path: report.json
          retention-days: 30
