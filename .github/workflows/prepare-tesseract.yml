name: Prepare Tesseract Windows candidate
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact ClicknTranslate source commit containing the component tools
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: components
      - name: Require an immutable source revision
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'Use the complete 40-character source commit hash.' }
      - uses: actions/checkout@v4
        with:
          repository: jabrailkhalil/clickntranslate
          ref: ${{ inputs.source_ref }}
          path: application
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow pefile==2024.8.26
      - name: Prepare and test pinned native candidate
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/application/src;$PWD/application/tools"
          @'
          import json, os, subprocess
          from pathlib import Path
          import requests
          from component_store import ComponentStore, file_digest
          from component_runtime import validate_tesseract
          from prepare_tesseract_component import prepare, extract_models
          recipe = json.loads(Path('components/recipes/tesseract-windows-x64.json').read_text())
          root = Path(os.environ['RUNNER_TEMP']) / 'tesseract-candidate'
          root.mkdir()
          def fetch(url, digest, name):
              target = root / name
              with requests.get(url, stream=True, timeout=180) as response:
                  response.raise_for_status()
                  with target.open('wb') as output:
                      for block in response.iter_content(1024*1024):
                          output.write(block)
              if file_digest(target) != digest:
                  raise RuntimeError('Source checksum mismatch: ' + name)
              return target
          extractor = recipe['extractor']
          bootstrap = fetch(extractor['bootstrap_url'], extractor['bootstrap_sha256'], '7zr.exe')
          sevenzip = fetch(extractor['installer_url'], extractor['installer_sha256'], '7zip.exe')
          subprocess.run([str(bootstrap), 'x', str(sevenzip), '-o'+str(root/'7zip'), '-y'], check=True)
          installer = fetch(recipe['runtime']['url'], recipe['runtime']['sha256'], 'tesseract.exe')
          subprocess.run([str(root/'7zip/7z.exe'), 'x', str(installer), '-o'+str(root/'extracted'), '-y'], check=True)
          commit = recipe['models']['commit']
          models = fetch(f'https://codeload.github.com/tesseract-ocr/tessdata_fast/zip/{commit}',
                         recipe['models']['archive_sha256'], 'models.zip')
          model_root = root/'models-source'
          extract_models(models, model_root, commit)
          candidate = root/'prepared'
          prepare(root/'extracted', model_root, {key:recipe[key] for key in ('runtime','models')}, candidate)
          catalog = json.loads((candidate/'catalog-candidate.json').read_text())
          languages = catalog['bundles'][0]['languages']
          for code in languages:
              import shutil
              shutil.copy2(model_root/(code+'.traineddata'), candidate/'runtime/tessdata')
          validate_tesseract(candidate, {'runtime':'native', 'executable':'runtime/tesseract.exe',
                                       'version_prefix':'tesseract v5.5.3', 'languages':languages})
          (candidate/'validation.json').write_text(json.dumps({
              'standalone_windows':True, 'recognizers':languages,
              'frozen_application':False, 'redistribution_review':False,
              'published':False}, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract candidate validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-windows-native-candidate
          path: |
            ${{ runner.temp }}/tesseract-candidate/prepared/tesseract-windows-x64-5.5.3-runtime.zip
            ${{ runner.temp }}/tesseract-candidate/prepared/runtime-artifact.json
            ${{ runner.temp }}/tesseract-candidate/prepared/catalog-candidate.json
            ${{ runner.temp }}/tesseract-candidate/prepared/validation.json
          compression-level: 0
          retention-days: 30
