name: Prepare EasyOCR Windows candidate
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact ClicknTranslate source commit containing the component tools
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: components
      - name: Require an immutable source revision
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'Use the complete 40-character source commit hash.' }
      - uses: actions/checkout@v4
        with:
          repository: jabrailkhalil/clickntranslate
          ref: ${{ inputs.source_ref }}
          path: application
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests packaging pefile==2024.8.26 pillow==12.3.0 arabic-reshaper==3.0.0 python-bidi==0.6.12
      - name: Prepare CPU-only runtime and original pinned model archives
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/application/src;$PWD/application/tools"
          @'
          from concurrent.futures import ThreadPoolExecutor
          import json, os, shutil
          from pathlib import Path
          from component_download import ComponentDownloader
          from prepare_component_runtime import prepare
          from prepare_easyocr_catalog import prepare as catalog
          root=Path(os.environ['RUNNER_TEMP'])/'ClicknTranslate-QA/easyocr-candidate'
          runtime, models=root/'prepared', root/'models'
          prepare(runtime,Path('components/recipes/easyocr-windows-x64.json'))
          (models/'archives').mkdir(parents=True)
          source=Path('components/recipes/easyocr-windows-models.json')
          description=json.loads(source.read_bytes())
          shutil.copyfile(source,models/'model-artifacts.json')
          def download(model):
              ComponentDownloader().artifact(model['url'],models/'archives'/(model['group']+'.zip'),model)
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(download,description['artifacts']))
          artifact=json.loads((runtime/'runtime-artifact.json').read_bytes())
          (root/'catalog-candidate.json').write_text(json.dumps(catalog(artifact,description),indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'EasyOCR candidate preparation failed' }
      - name: Test all model families, native recognition and transactional lifecycle
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/ClicknTranslate-QA/easyocr-candidate"
          python application/tools/qa_easyocr_components.py --catalog "$root/catalog-candidate.json" --runtime "$root/prepared/easyocr-windows-x64-cp312-cpu-runtime.zip" --models "$root/models" --output "$root/verification"
          if ($LASTEXITCODE -ne 0) { throw 'EasyOCR native validation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easyocr-windows-native-candidate
          path: |
            ${{ runner.temp }}/ClicknTranslate-QA/easyocr-candidate/prepared/easyocr-windows-x64-cp312-cpu-runtime.zip
            ${{ runner.temp }}/ClicknTranslate-QA/easyocr-candidate/prepared/runtime-artifact.json
            ${{ runner.temp }}/ClicknTranslate-QA/easyocr-candidate/prepared/requirements.lock
            ${{ runner.temp }}/ClicknTranslate-QA/easyocr-candidate/prepared/runtime/NATIVE-DEPENDENCIES.json
            ${{ runner.temp }}/ClicknTranslate-QA/easyocr-candidate/catalog-candidate.json
            ${{ runner.temp }}/ClicknTranslate-QA/easyocr-candidate/verification/verification.json
          compression-level: 0
          retention-days: 30
