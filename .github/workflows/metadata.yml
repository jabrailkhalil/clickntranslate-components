name: Verify and publish component metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: component-metadata
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Refresh online metadata only
        env:
          SNAPSHOT_KEY: ${{ secrets.COMPONENT_SNAPSHOT_KEY }}
          TIMESTAMP_KEY: ${{ secrets.COMPONENT_TIMESTAMP_KEY }}
        run: |
          python - <<'PY'
          import base64, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from component_repository import refresh_online
          with tempfile.TemporaryDirectory() as temporary:
              directory = Path(temporary)
              for role in ('snapshot', 'timestamp'):
                  value = os.environ[role.upper() + '_KEY']
                  if not value:
                      raise SystemExit('Online signing key is not configured: ' + role)
                  path = directory / (role + '.pem')
                  path.write_bytes(base64.b64decode(value, validate=True))
                  path.chmod(0o600)
              refresh_online(Path('public'), directory)
          PY
      - name: Preserve metadata history
        run: |
          git config user.name jabrailkhalil
          git config user.email 78273416+jabrailkhalil@users.noreply.github.com
          git add public
          git diff --cached --quiet || git commit -m 'Refresh component metadata freshness'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
