name: Prepare Hy-MT Windows candidate
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact ClicknTranslate source commit containing the component tools
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: components
      - name: Require an immutable source revision
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'Use the complete 40-character source commit hash.' }
      - uses: actions/checkout@v4
        with:
          repository: jabrailkhalil/clickntranslate
          ref: ${{ inputs.source_ref }}
          path: application
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests packaging pefile==2024.8.26
      - name: Prepare exact native runners and pinned model/document sources
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/application/src;$PWD/application/tools"
          @'
          import json, os
          from pathlib import Path
          from prepare_hymt_component import prepare, fetch
          root=Path(os.environ['RUNNER_TEMP'])/'ClicknTranslate-QA/hymt-candidate'
          root.mkdir(parents=True)
          path=Path('components/recipes/hymt-windows-x64.json')
          recipe=json.loads(path.read_bytes())
          baseline=dict(recipe,**json.loads(Path('components/recipes/hymt-windows-baseline.json').read_bytes()))
          baseline_path=root/'baseline-recipe.json'
          baseline_path.write_text(json.dumps(baseline,indent=2))
          prepare(root/'baseline',baseline_path)
          prepare(root/'prepared',path)
          sources=root/'model-sources';sources.mkdir()
          fetch(recipe['model'],sources/recipe['model']['name'])
          for document in recipe['docs']:
              fetch(document,sources/document['name'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Hy-MT candidate preparation failed' }
      - name: Test actual translation, private DLLs, update, rollback, cancellation and invalid models
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/ClicknTranslate-QA/hymt-candidate"
          python application/tools/qa_hymt_components.py --old "$root/baseline" --new "$root/prepared" --model "$root/model-sources/HY-MT1.5-1.8B-Q4_K_M.gguf" --docs "$root/model-sources" --output "$root/verification"
          if ($LASTEXITCODE -ne 0) { throw 'Hy-MT native validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: hymt-windows-native-candidate
          path: |
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/baseline/hymt-*-runtime.zip
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/baseline/runtime-artifact.json
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/prepared/hymt-*-runtime.zip
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/prepared/runtime-artifact.json
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/prepared/catalog-candidate.json
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/prepared/runtime/NATIVE-DEPENDENCIES.json
            ${{ runner.temp }}/ClicknTranslate-QA/hymt-candidate/verification/verification.json
          compression-level: 0
          retention-days: 30
